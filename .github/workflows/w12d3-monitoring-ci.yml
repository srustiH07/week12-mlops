name: W12D3 Monitoring ML Models CI/CD

on:
  push:
    branches:
      - "**"
    paths:
      - "day3-monitoring-ml-models/**"
      - ".github/workflows/w12d3-monitoring-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "day3-monitoring-ml-models/**"
      - ".github/workflows/w12d3-monitoring-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r day3-monitoring-ml-models/requirements.txt

      - name: Run Ruff
        run: ruff check day3-monitoring-ml-models

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r day3-monitoring-ml-models/requirements.txt

      - name: Run tests
        run: pytest day3-monitoring-ml-models/test_app.py -v

  build-and-push:
    name: Build and Push Docker Image
    needs:
      - lint
      - test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./day3-monitoring-ml-models
          push: true
          tags: ghcr.io/srustih07/week12-mlops:w12d3-latest